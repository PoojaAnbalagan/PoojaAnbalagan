<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Workflow: data, evaluate, serve, deploy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Workflow: data, evaluate, serve, deploy</title>
<defs>
<style>
.s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes role{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:translateY(0)}27%,100%{opacity:0;transform:translateY(-6px)}}
.up{opacity:0;animation:up .7s ease-out forwards}
.pl{animation:pulse 2.4s ease-in-out infinite}
.role{opacity:0;animation:role 12s ease-in-out infinite backwards}
@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pl,.role{animation:none}.role:first-of-type{opacity:1}}
</style>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1329"/><stop offset="1" stop-color="#080D1B"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#67E8F9" stop-opacity=".55"/><stop offset=".55" stop-color="#818CF8" stop-opacity=".18"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<radialGradient id="gc"><stop offset="0" stop-color="#67E8F9" stop-opacity="1"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
<radialGradient id="gi"><stop offset="0" stop-color="#818CF8" stop-opacity="1"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<clipPath id="fr"><rect width="1000" height="250" rx="20"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1000" height="250" fill="url(#bg)"/>
<rect width="1000" height="250" fill="url(#grid)"/>
<circle cx="500" cy="125" r="228" fill="url(#gi)" opacity="0.16"><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="10s" repeatCount="indefinite"/></circle><line x1="48" y1="122.0" x2="952" y2="122.0" stroke="url(#acc)" stroke-opacity=".35" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line><g><rect x="48" y="70" width="190" height="104" rx="16" fill="#111A33" stroke="#67E8F9" stroke-opacity=".5"/><rect x="48" y="70" width="190" height="104" rx="16" fill="none" stroke="#67E8F9" stroke-width="2" class="pl" style="animation-delay:0.0s"/><text x="70" y="102" class="m" font-size="11" letter-spacing="2" fill="#67E8F9">STEP 1</text><text x="70" y="130" class="s" font-size="20" font-weight="800" fill="#fff">DATA</text><text x="70" y="152" class="s" font-size="12.5" fill="#94A3B8">Prepare · EDA · features</text></g><g><rect x="286" y="70" width="190" height="104" rx="16" fill="#111A33" stroke="#818CF8" stroke-opacity=".5"/><rect x="286" y="70" width="190" height="104" rx="16" fill="none" stroke="#818CF8" stroke-width="2" class="pl" style="animation-delay:0.6s"/><text x="308" y="102" class="m" font-size="11" letter-spacing="2" fill="#818CF8">STEP 2</text><text x="308" y="130" class="s" font-size="20" font-weight="800" fill="#fff">EVALUATE</text><text x="308" y="152" class="s" font-size="12.5" fill="#94A3B8">Benchmarks · metrics</text></g><g><rect x="524" y="70" width="190" height="104" rx="16" fill="#111A33" stroke="#67E8F9" stroke-opacity=".5"/><rect x="524" y="70" width="190" height="104" rx="16" fill="none" stroke="#67E8F9" stroke-width="2" class="pl" style="animation-delay:1.2s"/><text x="546" y="102" class="m" font-size="11" letter-spacing="2" fill="#67E8F9">STEP 3</text><text x="546" y="130" class="s" font-size="20" font-weight="800" fill="#fff">SERVE</text><text x="546" y="152" class="s" font-size="12.5" fill="#94A3B8">FastAPI · REST endpoints</text></g><g><rect x="762" y="70" width="190" height="104" rx="16" fill="#111A33" stroke="#818CF8" stroke-opacity=".5"/><rect x="762" y="70" width="190" height="104" rx="16" fill="none" stroke="#818CF8" stroke-width="2" class="pl" style="animation-delay:1.7999999999999998s"/><text x="784" y="102" class="m" font-size="11" letter-spacing="2" fill="#818CF8">STEP 4</text><text x="784" y="130" class="s" font-size="20" font-weight="800" fill="#fff">DEPLOY</text><text x="784" y="152" class="s" font-size="12.5" fill="#94A3B8">Docker · Kubernetes · CI</text></g><circle r="6" fill="#67E8F9"><animateMotion dur="5s" repeatCount="indefinite" path="M48,122.0 L952,122.0"/><animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/></circle><text x="500" y="214" text-anchor="middle" class="m" font-size="12" letter-spacing="2.5" fill="#CBD5E1">MEASURABLE · REPRODUCIBLE · TESTABLE · USEFUL BEYOND A NOTEBOOK</text>
<rect width="1000" height="3" fill="url(#acc)"/>
<rect width="260" height="3" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" from="-260 0" to="1000 0" dur="5s" repeatCount="indefinite"/></rect>
</g>
<rect x=".5" y=".5" width="999" height="249" rx="20" fill="none" stroke="url(#acc)" stroke-opacity=".35"/>
</svg>
