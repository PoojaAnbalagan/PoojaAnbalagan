<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 306" width="1000" height="306" role="img" aria-label="AgroGuard-AI: Computer Vision · Transfer Learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AgroGuard-AI: Computer Vision · Transfer Learning</title>
<defs>
<style>
.s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes role{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:translateY(0)}27%,100%{opacity:0;transform:translateY(-6px)}}
.up{opacity:0;animation:up .7s ease-out forwards}
.pl{animation:pulse 2.4s ease-in-out infinite}
.role{opacity:0;animation:role 12s ease-in-out infinite backwards}
@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pl,.role{animation:none}.role:first-of-type{opacity:1}}
</style>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1329"/><stop offset="1" stop-color="#080D1B"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#67E8F9" stop-opacity=".55"/><stop offset=".55" stop-color="#818CF8" stop-opacity=".18"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<radialGradient id="gc"><stop offset="0" stop-color="#67E8F9" stop-opacity="1"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
<radialGradient id="gi"><stop offset="0" stop-color="#818CF8" stop-opacity="1"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<clipPath id="fr"><rect width="1000" height="306" rx="20"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1000" height="306" fill="url(#bg)"/>
<rect width="1000" height="306" fill="url(#grid)"/>
<circle cx="900" cy="60" r="133" fill="url(#gi)" opacity="0.2"><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="9s" repeatCount="indefinite"/></circle><circle cx="44" cy="42" r="4" fill="#67E8F9" class="pl"/><text x="58" y="46" class="m" font-size="11" letter-spacing="2" fill="#94A3B8">PROJECT 02  ·  COMPUTER VISION · TRANSFER LEARNING</text><text x="40" y="86" class="s" font-size="27" font-weight="800" fill="#fff">AgroGuard-AI</text><text x="40" y="118" class="s" font-size="14" fill="#CBD5E1">Multi-crop plant disease classifier using MobileNetV3-Small transfer learning across 112 plant pathology</text><text x="40" y="140" class="s" font-size="14" fill="#CBD5E1">classes, exported to ONNX for CPU inference with a standalone CLI and a Node.js integration bridge.</text><g class="up" style="animation-delay:0.15s"><rect x="40" y="168" width="220" height="70" rx="12" fill="#111A33" stroke="#67E8F9" stroke-opacity=".3"/><text x="58" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">95.28%</text><text x="58" y="223" class="s" font-size="12" fill="#94A3B8">Top-1 accuracy</text></g><g class="up" style="animation-delay:0.27s"><rect x="274" y="168" width="220" height="70" rx="12" fill="#111A33" stroke="#818CF8" stroke-opacity=".3"/><text x="292" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">99.15%</text><text x="292" y="223" class="s" font-size="12" fill="#94A3B8">Top-3 accuracy</text></g><g class="up" style="animation-delay:0.39s"><rect x="507" y="168" width="220" height="70" rx="12" fill="#111A33" stroke="#67E8F9" stroke-opacity=".3"/><text x="525" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">94.23%</text><text x="525" y="223" class="s" font-size="12" fill="#94A3B8">Macro-F1</text></g><g class="up" style="animation-delay:0.51s"><rect x="740" y="168" width="220" height="70" rx="12" fill="#111A33" stroke="#818CF8" stroke-opacity=".3"/><text x="758" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">~18.5 ms</text><text x="758" y="223" class="s" font-size="12" fill="#94A3B8">ONNX CPU latency / sample</text></g><g class="up" style="animation-delay:0.23s"><rect x="40.0" y="256" width="76.2" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="52.0" cy="271" r="3" fill="#67E8F9"/><text x="63.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="43.2" lengthAdjust="spacingAndGlyphs">Python</text></g><g class="up" style="animation-delay:0.27s"><rect x="124.2" y="256" width="83.4" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="136.2" cy="271" r="3" fill="#818CF8"/><text x="147.2" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="50.4" lengthAdjust="spacingAndGlyphs">PyTorch</text></g><g class="up" style="animation-delay:0.31s"><rect x="215.6" y="256" width="155.4" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="227.6" cy="271" r="3" fill="#67E8F9"/><text x="238.6" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="122.4" lengthAdjust="spacingAndGlyphs">MobileNetV3-Small</text></g><g class="up" style="animation-delay:0.35s"><rect x="379.0" y="256" width="61.8" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="391.0" cy="271" r="3" fill="#818CF8"/><text x="402.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="28.8" lengthAdjust="spacingAndGlyphs">ONNX</text></g><g class="up" style="animation-delay:0.39s"><rect x="448.8" y="256" width="83.4" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="460.8" cy="271" r="3" fill="#67E8F9"/><text x="471.8" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="50.4" lengthAdjust="spacingAndGlyphs">Node.js</text></g>
<rect width="1000" height="3" fill="url(#acc)"/>
<rect width="260" height="3" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" from="-260 0" to="1000 0" dur="5s" repeatCount="indefinite"/></rect>
</g>
<rect x=".5" y=".5" width="999" height="305" rx="20" fill="none" stroke="url(#acc)" stroke-opacity=".35"/>
</svg>
