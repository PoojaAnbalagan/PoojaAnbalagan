<circle cx="900" cy="60" r="133" fill="url(#gc)" opacity="0.2"><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="9s" repeatCount="indefinite"/></circle><circle cx="44" cy="42" r="4" fill="#67E8F9" class="pl"/><text x="58" y="46" class="m" font-size="11" letter-spacing="2" fill="#94A3B8">PROJECT 01  ·  FULL-STACK ML · NLP · DEPLOYMENT</text><text x="40" y="86" class="s" font-size="27" font-weight="800" fill="#fff">Customer Review Sentiment Analytics Platform</text><text x="40" y="118" class="s" font-size="14" fill="#CBD5E1">An end-to-end sentiment analytics platform serving predictions from a trained text-classification pipeline</text><text x="40" y="140" class="s" font-size="14" fill="#CBD5E1">through a FastAPI backend and React/Vite frontend, with Docker, Kubernetes manifests and GitHub Actions CI.</text><g class="up" style="animation-delay:0.15s"><rect x="40" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#67E8F9" stroke-opacity=".3"/><text x="58" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">90.93%</text><text x="58" y="223" class="s" font-size="12" fill="#94A3B8">DistilBERT accuracy</text></g><g class="up" style="animation-delay:0.27s"><rect x="351" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#818CF8" stroke-opacity=".3"/><text x="369" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">0.8906</text><text x="369" y="223" class="s" font-size="12" fill="#94A3B8">DistilBERT macro-F1</text></g><g class="up" style="animation-delay:0.39s"><rect x="663" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#67E8F9" stroke-opacity=".3"/><text x="681" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">0.5539 → 0.8906</text><text x="681" y="223" class="s" font-size="12" fill="#94A3B8">Macro-F1: VADER → DistilBERT</text></g><g class="up" style="animation-delay:0.19s"><rect x="40.0" y="256" width="76.2" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="52.0" cy="271" r="3" fill="#818CF8"/><text x="63.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="43.2" lengthAdjust="spacingAndGlyphs">Python</text></g><g class="up" style="animation-delay:0.23s"><rect x="124.2" y="256" width="83.4" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="136.2" cy="271" r="3" fill="#67E8F9"/><text x="147.2" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="50.4" lengthAdjust="spacingAndGlyphs">FastAPI</text></g><g class="up" style="animation-delay:0.27s"><rect x="215.6" y="256" width="119.4" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="227.6" cy="271" r="3" fill="#818CF8"/><text x="238.6" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="86.4" lengthAdjust="spacingAndGlyphs">scikit-learn</text></g><g class="up" style="animation-delay:0.31s"><rect x="343.0" y="256" width="105.0" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="355.0" cy="271" r="3" fill="#67E8F9"/><text x="366.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="72.0" lengthAdjust="spacingAndGlyphs">DistilBERT</text></g><g class="up" style="animation-delay:0.35s"><rect x="456.0" y="256" width="69.0" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="468.0" cy="271" r="3" fill="#818CF8"/><text x="479.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="36.0" lengthAdjust="spacingAndGlyphs">React</text></g><g class="up" style="animation-delay:0.39s"><rect x="533.0" y="256" width="61.8" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="545.0" cy="271" r="3" fill="#67E8F9"/><text x="556.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="28.8" lengthAdjust="spacingAndGlyphs">Vite</text></g><g class="up" style="animation-delay:0.43s"><rect x="602.8" y="256" width="76.2" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="614.8" cy="271" r="3" fill="#818CF8"/><text x="625.8" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="43.2" lengthAdjust="spacingAndGlyphs">Docker</text></g><g class="up" style="animation-delay:0.47s"><rect x="687.0" y="256" width="105.0" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="699.0" cy="271" r="3" fill="#67E8F9"/><text x="710.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="72.0" lengthAdjust="spacingAndGlyphs">Kubernetes</text></g><g class="up" style="animation-delay:0.51s"><rect x="800.0" y="256" width="133.8" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="812.0" cy="271" r="3" fill="#818CF8"/><text x="823.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="100.8" lengthAdjust="spacingAndGlyphs">GitHub Actions</text></g>
