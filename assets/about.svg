<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 258" width="1000" height="258" role="img" aria-label="Focus areas: machine learning, data science, applications, ML engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Focus areas: machine learning, data science, applications, ML engineering</title>
<defs>
<style>
.s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes role{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:translateY(0)}27%,100%{opacity:0;transform:translateY(-6px)}}
.up{opacity:0;animation:up .7s ease-out forwards}
.pl{animation:pulse 2.4s ease-in-out infinite}
.role{opacity:0;animation:role 12s ease-in-out infinite backwards}
@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pl,.role{animation:none}.role:first-of-type{opacity:1}}
</style>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1329"/><stop offset="1" stop-color="#080D1B"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#67E8F9" stop-opacity=".55"/><stop offset=".55" stop-color="#818CF8" stop-opacity=".18"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<radialGradient id="gc"><stop offset="0" stop-color="#67E8F9" stop-opacity="1"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
<radialGradient id="gi"><stop offset="0" stop-color="#818CF8" stop-opacity="1"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<clipPath id="fr"><rect width="1000" height="258" rx="20"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1000" height="258" fill="url(#bg)"/>
<rect width="1000" height="258" fill="url(#grid)"/>
<circle cx="900" cy="129" r="171" fill="url(#gi)" opacity="0.16"><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="9s" repeatCount="indefinite"/></circle><g class="up" style="animation-delay:0.1s"><rect x="32" y="30" width="461" height="92" rx="14" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><rect x="32" y="46" width="3" height="60" rx="1.5" fill="#67E8F9"/><text x="56" y="58" class="m" font-size="11" font-weight="700" letter-spacing="2" fill="#67E8F9">MACHINE LEARNING</text><text x="56" y="83" class="s" font-size="16" font-weight="700" fill="#fff">Models you can trust</text><text x="56" y="104" class="s" font-size="12.5" fill="#94A3B8">Classification, clustering, transfer learning, transformers</text></g><g class="up" style="animation-delay:0.2s"><rect x="507" y="30" width="461" height="92" rx="14" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><rect x="507" y="46" width="3" height="60" rx="1.5" fill="#818CF8"/><text x="531" y="58" class="m" font-size="11" font-weight="700" letter-spacing="2" fill="#818CF8">DATA SCIENCE</text><text x="531" y="83" class="s" font-size="16" font-weight="700" fill="#fff">From raw data to insight</text><text x="531" y="104" class="s" font-size="12.5" fill="#94A3B8">Data prep, EDA, feature engineering, statistics, dashboards</text></g><g class="up" style="animation-delay:0.3s"><rect x="32" y="136" width="461" height="92" rx="14" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><rect x="32" y="152" width="3" height="60" rx="1.5" fill="#818CF8"/><text x="56" y="164" class="m" font-size="11" font-weight="700" letter-spacing="2" fill="#818CF8">APPLICATIONS</text><text x="56" y="189" class="s" font-size="16" font-weight="700" fill="#fff">Models people can use</text><text x="56" y="210" class="s" font-size="12.5" fill="#94A3B8">REST APIs, full-stack integration, inference workflows</text></g><g class="up" style="animation-delay:0.4s"><rect x="507" y="136" width="461" height="92" rx="14" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><rect x="507" y="152" width="3" height="60" rx="1.5" fill="#67E8F9"/><text x="531" y="164" class="m" font-size="11" font-weight="700" letter-spacing="2" fill="#67E8F9">ML ENGINEERING</text><text x="531" y="189" class="s" font-size="16" font-weight="700" fill="#fff">Reproducible and deployable</text><text x="531" y="210" class="s" font-size="12.5" fill="#94A3B8">Docker, Compose, Kubernetes manifests, GitHub Actions, ONNX</text></g>
<rect width="1000" height="3" fill="url(#acc)"/>
<rect width="260" height="3" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" from="-260 0" to="1000 0" dur="5s" repeatCount="indefinite"/></rect>
</g>
<rect x=".5" y=".5" width="999" height="257" rx="20" fill="none" stroke="url(#acc)" stroke-opacity=".35"/>
</svg>
