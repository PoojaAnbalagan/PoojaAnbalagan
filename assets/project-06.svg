<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 306" width="1000" height="306" role="img" aria-label="Barking Shelter: Full-Stack Development · Rest Apis" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Barking Shelter: Full-Stack Development · Rest Apis</title>
<defs>
<style>
.s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes role{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:translateY(0)}27%,100%{opacity:0;transform:translateY(-6px)}}
.up{opacity:0;animation:up .7s ease-out forwards}
.pl{animation:pulse 2.4s ease-in-out infinite}
.role{opacity:0;animation:role 12s ease-in-out infinite backwards}
@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pl,.role{animation:none}.role:first-of-type{opacity:1}}
</style>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1329"/><stop offset="1" stop-color="#080D1B"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#67E8F9" stop-opacity=".55"/><stop offset=".55" stop-color="#818CF8" stop-opacity=".18"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<radialGradient id="gc"><stop offset="0" stop-color="#67E8F9" stop-opacity="1"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
<radialGradient id="gi"><stop offset="0" stop-color="#818CF8" stop-opacity="1"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<clipPath id="fr"><rect width="1000" height="306" rx="20"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1000" height="306" fill="url(#bg)"/>
<rect width="1000" height="306" fill="url(#grid)"/>
<circle cx="900" cy="60" r="133" fill="url(#gi)" opacity="0.2"><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="9s" repeatCount="indefinite"/></circle><circle cx="44" cy="42" r="4" fill="#67E8F9" class="pl"/><text x="58" y="46" class="m" font-size="11" letter-spacing="2" fill="#94A3B8">PROJECT 06  ·  FULL-STACK DEVELOPMENT · REST APIS</text><text x="40" y="86" class="s" font-size="27" font-weight="800" fill="#fff">Barking Shelter</text><text x="40" y="118" class="s" font-size="14" fill="#CBD5E1">A pet-adoption platform intended to connect pets with potential adopters, built with a React frontend</text><text x="40" y="140" class="s" font-size="14" fill="#CBD5E1">styled in Tailwind CSS and a Django REST Framework backend.</text><g class="up" style="animation-delay:0.15s"><rect x="40" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#67E8F9" stroke-opacity=".3"/><text x="58" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">React</text><text x="58" y="223" class="s" font-size="12" fill="#94A3B8">Tailwind CSS frontend</text></g><g class="up" style="animation-delay:0.27s"><rect x="351" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#818CF8" stroke-opacity=".3"/><text x="369" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">Django REST</text><text x="369" y="223" class="s" font-size="12" fill="#94A3B8">Backend API</text></g><g class="up" style="animation-delay:0.39s"><rect x="663" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#67E8F9" stroke-opacity=".3"/><text x="681" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">SQLite · MySQL</text><text x="681" y="223" class="s" font-size="12" fill="#94A3B8">Database integration &amp; migration</text></g><g class="up" style="animation-delay:0.39s"><rect x="40.0" y="256" width="69.0" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="52.0" cy="271" r="3" fill="#67E8F9"/><text x="63.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="36.0" lengthAdjust="spacingAndGlyphs">React</text></g><g class="up" style="animation-delay:0.43s"><rect x="117.0" y="256" width="119.4" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="129.0" cy="271" r="3" fill="#818CF8"/><text x="140.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="86.4" lengthAdjust="spacingAndGlyphs">Tailwind CSS</text></g><g class="up" style="animation-delay:0.47s"><rect x="244.4" y="256" width="184.2" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="256.4" cy="271" r="3" fill="#67E8F9"/><text x="267.4" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="151.2" lengthAdjust="spacingAndGlyphs">Django REST Framework</text></g><g class="up" style="animation-delay:0.51s"><rect x="436.6" y="256" width="76.2" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="448.6" cy="271" r="3" fill="#818CF8"/><text x="459.6" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="43.2" lengthAdjust="spacingAndGlyphs">SQLite</text></g><g class="up" style="animation-delay:0.55s"><rect x="520.8" y="256" width="69.0" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="532.8" cy="271" r="3" fill="#67E8F9"/><text x="543.8" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="36.0" lengthAdjust="spacingAndGlyphs">MySQL</text></g>
<rect width="1000" height="3" fill="url(#acc)"/>
<rect width="260" height="3" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" from="-260 0" to="1000 0" dur="5s" repeatCount="indefinite"/></rect>
</g>
<rect x=".5" y=".5" width="999" height="305" rx="20" fill="none" stroke="url(#acc)" stroke-opacity=".35"/>
</svg>
