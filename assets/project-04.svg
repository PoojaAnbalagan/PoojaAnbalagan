<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 306" width="1000" height="306" role="img" aria-label="AWS Customer Churn Prediction Pipeline: Aws · Data Engineering · Monitoring" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AWS Customer Churn Prediction Pipeline: Aws · Data Engineering · Monitoring</title>
<defs>
<style>
.s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes role{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:translateY(0)}27%,100%{opacity:0;transform:translateY(-6px)}}
.up{opacity:0;animation:up .7s ease-out forwards}
.pl{animation:pulse 2.4s ease-in-out infinite}
.role{opacity:0;animation:role 12s ease-in-out infinite backwards}
@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pl,.role{animation:none}.role:first-of-type{opacity:1}}
</style>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1329"/><stop offset="1" stop-color="#080D1B"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#67E8F9" stop-opacity=".55"/><stop offset=".55" stop-color="#818CF8" stop-opacity=".18"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<radialGradient id="gc"><stop offset="0" stop-color="#67E8F9" stop-opacity="1"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
<radialGradient id="gi"><stop offset="0" stop-color="#818CF8" stop-opacity="1"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<clipPath id="fr"><rect width="1000" height="306" rx="20"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1000" height="306" fill="url(#bg)"/>
<rect width="1000" height="306" fill="url(#grid)"/>
<circle cx="900" cy="60" r="133" fill="url(#gi)" opacity="0.2"><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="9s" repeatCount="indefinite"/></circle><circle cx="44" cy="42" r="4" fill="#67E8F9" class="pl"/><text x="58" y="46" class="m" font-size="11" letter-spacing="2" fill="#94A3B8">PROJECT 04  ·  AWS · DATA ENGINEERING · MONITORING</text><text x="40" y="86" class="s" font-size="27" font-weight="800" fill="#fff">AWS Customer Churn Prediction Pipeline</text><rect x="854" y="26" width="106" height="26" rx="13" fill="#111A33" stroke="url(#acc)"/><text x="907" y="43" text-anchor="middle" class="m" font-size="11" font-weight="700" fill="#67E8F9">IN PROGRESS</text><text x="40" y="118" class="s" font-size="14" fill="#CBD5E1">Cloud data workflow for a customer-churn prediction group project: S3 storage, a Lambda CSV validator</text><text x="40" y="140" class="s" font-size="14" fill="#CBD5E1">triggered on upload, and CloudWatch logs for debugging. Being refined, not a finished production deployment.</text><g class="up" style="animation-delay:0.15s"><rect x="40" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#67E8F9" stroke-opacity=".3"/><text x="58" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">S3</text><text x="58" y="223" class="s" font-size="12" fill="#94A3B8">Project data &amp; prediction outputs</text></g><g class="up" style="animation-delay:0.27s"><rect x="351" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#818CF8" stroke-opacity=".3"/><text x="369" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">Lambda</text><text x="369" y="223" class="s" font-size="12" fill="#94A3B8">CSV validation on upload</text></g><g class="up" style="animation-delay:0.39s"><rect x="663" y="168" width="297" height="70" rx="12" fill="#111A33" stroke="#67E8F9" stroke-opacity=".3"/><text x="681" y="201" class="m" font-size="23" font-weight="700" fill="url(#acc)">CloudWatch</text><text x="681" y="223" class="s" font-size="12" fill="#94A3B8">Logs for troubleshooting</text></g><g class="up" style="animation-delay:0.31s"><rect x="40.0" y="256" width="76.2" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="52.0" cy="271" r="3" fill="#67E8F9"/><text x="63.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="43.2" lengthAdjust="spacingAndGlyphs">AWS S3</text></g><g class="up" style="animation-delay:0.35s"><rect x="124.2" y="256" width="105.0" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="136.2" cy="271" r="3" fill="#818CF8"/><text x="147.2" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="72.0" lengthAdjust="spacingAndGlyphs">AWS Lambda</text></g><g class="up" style="animation-delay:0.39s"><rect x="237.2" y="256" width="105.0" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="249.2" cy="271" r="3" fill="#67E8F9"/><text x="260.2" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="72.0" lengthAdjust="spacingAndGlyphs">CloudWatch</text></g><g class="up" style="animation-delay:0.43s"><rect x="350.2" y="256" width="76.2" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="362.2" cy="271" r="3" fill="#818CF8"/><text x="373.2" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="43.2" lengthAdjust="spacingAndGlyphs">Python</text></g><g class="up" style="animation-delay:0.47s"><rect x="434.4" y="256" width="54.6" height="30" rx="9" fill="#111A33" stroke="#67E8F9" stroke-opacity=".35"/><circle cx="446.4" cy="271" r="3" fill="#67E8F9"/><text x="457.4" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="21.6" lengthAdjust="spacingAndGlyphs">CSV</text></g><g class="up" style="animation-delay:0.51s"><rect x="497.0" y="256" width="54.6" height="30" rx="9" fill="#111A33" stroke="#818CF8" stroke-opacity=".35"/><circle cx="509.0" cy="271" r="3" fill="#818CF8"/><text x="520.0" y="275.5" class="m" font-size="12" fill="#E2E8F0" textLength="21.6" lengthAdjust="spacingAndGlyphs">IAM</text></g>
<rect width="1000" height="3" fill="url(#acc)"/>
<rect width="260" height="3" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" from="-260 0" to="1000 0" dur="5s" repeatCount="indefinite"/></rect>
</g>
